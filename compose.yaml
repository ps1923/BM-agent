services:
  requirements-harness:
    build:
      context: .
      dockerfile: harnesses/requirements/Dockerfile
    environment:
      PORT: 8101
      HARNESS_HOST: 0.0.0.0
      HARNESS_PROVIDER: ${HARNESS_PROVIDER:-deterministic}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      REQUIREMENTS_MODEL: ${REQUIREMENTS_MODEL:-}
    expose:
      - "8101"
    networks:
      - requirements-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  planner-harness:
    build:
      context: .
      dockerfile: harnesses/planner/Dockerfile
    environment:
      PORT: 8102
      HARNESS_HOST: 0.0.0.0
      HARNESS_PROVIDER: ${HARNESS_PROVIDER:-deterministic}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      PLANNER_MODEL: ${PLANNER_MODEL:-}
    expose:
      - "8102"
    networks:
      - planner-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bm-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:-jdbc:mysql://host.docker.internal:3306/BM-sql?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      DB_USER: ${DB_USER:-bm_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REQUIREMENTS_HARNESS_URL: http://requirements-harness:8101
      PLANNER_HARNESS_URL: http://planner-harness:8102
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://127.0.0.1:8000,http://localhost:8000}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-PT45S}
      GUIDANCE_MAX_CONTEXT_CHARS: ${GUIDANCE_MAX_CONTEXT_CHARS:-120000}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-PT20S}
      CHROMA_BASE_URL: ${CHROMA_BASE_URL:-}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-bm_hs_bugs}
      CHROMA_API_KEY: ${CHROMA_API_KEY:-}
      CHROMA_TIMEOUT: ${CHROMA_TIMEOUT:-PT20S}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      requirements-harness:
        condition: service_healthy
      planner-harness:
        condition: service_healthy
    networks:
      - requirements-net
      - planner-net
    restart: unless-stopped

networks:
  requirements-net: {}
  planner-net: {}
